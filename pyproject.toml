[build-system]
requires = ["setuptools>=75"]
build-backend= "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "cdms-handson"
version = "0.1.0"
description = "Change Data Management Service prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.126,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<2.2",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "openpyxl>=3.1,<4.0",
    "faker>=30,<40",
    "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts ="-q"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing= true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
